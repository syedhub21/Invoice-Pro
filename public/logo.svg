<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ip-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="ip-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background badge -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#ip-bg)"/>

  <!-- Document -->
  <g filter="url(#ip-shadow)">
    <path d="M31 26 H60 L71 37 V74 A4 4 0 0 1 67 78 H31 A4 4 0 0 1 27 74 V30 A4 4 0 0 1 31 26 Z"
          fill="#ffffff"/>
    <!-- folded corner -->
    <path d="M60 26 L71 37 H64 A4 4 0 0 1 60 33 Z" fill="#d1fae5"/>
  </g>

  <!-- Invoice lines -->
  <rect x="35" y="46" width="28" height="3.4" rx="1.7" fill="#a7f3d0"/>
  <rect x="35" y="54" width="28" height="3.4" rx="1.7" fill="#a7f3d0"/>
  <rect x="35" y="62" width="18" height="3.4" rx="1.7" fill="#a7f3d0"/>

  <!-- Checkmark badge -->
  <circle cx="70" cy="70" r="15" fill="#065f46" stroke="#ffffff" stroke-width="3"/>
  <path d="M63.5 70.5 L68 75 L77 65" fill="none" stroke="#ffffff" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
